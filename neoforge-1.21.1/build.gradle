plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run-client')
        }
        server {
            server()
            gameDirectory = project.file('run-server')
        }
    }

    mods {
        timelesss {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    def replaceProperties = [
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description,
        minecraft_version: minecraft_version,
        neo_version: neo_version
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}


sourceSets.main.java.srcDir "../common/src/main/java"

// Isolated headless integration tests; these sources are excluded from release JARs.
if (project.hasProperty('timelesssSelfTest')) {
    sourceSets.main.java.srcDir "../tests/java"
    sourceSets.main.java.srcDir "src/selftest/java"
    neoForge.runs.server {
        gameDirectory = project.file(project.property('timelesssTestDir'))
        systemProperty 'timelesss.selftest', 'true'
        programArgument '--nogui'
    }
}
